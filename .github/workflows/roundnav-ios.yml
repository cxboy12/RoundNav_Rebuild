name: Build RoundNav iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/roundnav-ios.yml'
      - 'carwithin-fork/App/**'
      - 'carwithin-fork/Sources/**'
      - 'carwithin-fork/TDSCarKit.xcodeproj/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile iOS device target
        run: |
          xcodebuild -version
          xcodebuild \
            -project carwithin-fork/TDSCarKit.xcodeproj \
            -scheme TDSCarKit \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/roundnav-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.cxboy12.roundnav.carwithin \
            build
      - name: Package unsigned IPA
        run: |
          products="$RUNNER_TEMP/roundnav-derived/Build/Products/Release-iphoneos"
          package="$RUNNER_TEMP/roundnav-package"
          mkdir -p "$package/Payload"
          ditto "$products/TDSCarKit.app" "$package/Payload/TDSCarKit.app"
          app="$package/Payload/TDSCarKit.app"
          plutil -replace CFBundleDisplayName -string 'CarWithin RoundNav' "$app/Info.plist"
          executable="$(plutil -extract CFBundleExecutable raw "$app/Info.plist")"
          lipo "$app/$executable" -verify_arch arm64
          ditto -c -k --keepParent "$package/Payload" "$RUNNER_TEMP/CarWithin-RoundNav-unsigned.ipa"
          unzip -tq "$RUNNER_TEMP/CarWithin-RoundNav-unsigned.ipa"
      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CarWithin-RoundNav-unsigned
          path: ${{ runner.temp }}/CarWithin-RoundNav-unsigned.ipa
          if-no-files-found: error
